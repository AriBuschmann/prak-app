<section class="page">
  <template if.bind="contract">
    <p class="breadcrumb">
      <!-- "/" am Anfang: Pfad von der obersten Ebene der App aus. Ohne "/" hängt der Router ihn an die aktuelle Seite an
           (contracts/77/customers), die Route gibt es nicht → Fehler AUR3401 -->
      <a load="/customers" t="customers.title"></a> ›
      <a load="/customers/${contract.customerId}">${contract.customerName}</a> ›
      ${contract.contractNumber}
    </p>

    <div class="page-header">
      <h1>${contract.contractNumber} <span class="badge status-${contract.status}">${'contract.statusValues.' + contract.status | t}</span></h1>
      <div class="actions">
        <button type="button" click.trigger="cancelContract()" disabled.bind="contract.status !== 'Active'" t="contract.cancel"></button>
        <!-- Nur bei gekündigten Verträgen. Ausgegraut, wenn die Kündigung von vor der Rücknahme-Funktion stammt (Hinweis als Tooltip) -->
        <button type="button" if.bind="contract.status === 'Cancelled'" click.trigger="showUndoCancellation()"
                disabled.bind="!contract.cancellationUndoable"
                title.bind="undoTooltip" t="contract.undoCancel"></button>
        <button type="button" class="primary" click.trigger="showPayment()" t="payment.new"></button>
      </div>
    </div>

    <div class="columns">
      <div class="card details">
        <dl>
          <dt t="contract.customer"></dt><dd>${contract.customerName}</dd>
          <dt t="contract.type"></dt><dd>${contract.typeName}</dd>
          <dt t="contract.startDate"></dt><dd>${formatDate(contract.startDate)}</dd>
          <dt t="contract.endDate"></dt><dd data-testid="contract-end-date">${formatDate(contract.endDate) || '–'}</dd>
          <dt t="contract.monthlyFee"></dt><dd>${formatMoney(contract.monthlyFee)}</dd>
          <dt t="contract.noticePeriod"></dt><dd>${contract.noticePeriodMonths} ${'common.months' | t}</dd>
          <template if.bind="contract.cancelledAt">
            <dt t="contract.cancelledAt"></dt><dd>${formatDate(contract.cancelledAt)}</dd>
            <dt t="contract.cancellationReason"></dt><dd>${contract.cancellationReason || '–'}</dd>
          </template>
        </dl>
      </div>

      <div class="card balance" if.bind="balance">
        <h2 t="balance.title"></h2>
        <dl>
          <dt t="balance.monthsDue"></dt><dd data-testid="months-due">${balance.monthsDue}</dd>
          <dt t="balance.expected"></dt><dd>${formatMoney(balance.expectedTotal)}</dd>
          <dt t="balance.paid"></dt><dd>${formatMoney(balance.paidTotal)}</dd>
          <dt t="balance.balance"></dt>
          <dd class="${balance.balance > 0 ? 'negative' : 'positive'}" data-testid="balance">${formatMoney(balance.balance)}</dd>
        </dl>
        <!-- Rückstand über zwei Monatsbeiträge → laut Handbuch (3.5) ist eine Zahlungserinnerung fällig -->
        <p class="reminder-due" if.bind="balance.reminderDue" data-testid="reminder-due" t="balance.reminderDue"></p>
      </div>
    </div>

    <div class="section-header">
      <h2 t="payment.title"></h2>
      <!-- Ein Link statt Knopf: Der Browser lädt die Datei selbst herunter und schickt dabei das Anmelde-Cookie mit.
           "external": Der Aurelia-Router soll den Klick nicht abfangen, sonst sucht er eine Seite "api/..." (AUR3401) -->
      <a class="button" if.bind="payments.length" href="/api/contracts/${contract.id}/payments/export" download external
         t="payment.exportCsv"></a>
    </div>
    <p class="muted" if.bind="!payments.length" t="payment.none"></p>
    <jqx-grid else columns.bind="columns" rows.bind="payments" page-size.bind="10"></jqx-grid>
  </template>

  <modal-dialog heading.bind="'payment.new' | t" open.bind="paymentOpen">
    <form submit.trigger:prevent="savePayment()">
      <div class="form-grid">
        <label>
          <span t="payment.amount"></span>
          <input name="amount" type="number" step="0.01" min="0" value.bind="payment.amount">
          <small class="error" repeat.for="message of paymentErrors.amount">${message}</small>
        </label>
        <label>
          <span t="payment.date"></span>
          <div ref="paymentDateEl" data-testid="payment-date"></div>
          <small class="error" repeat.for="message of paymentErrors.paymentDate">${message}</small>
        </label>
        <label class="wide">
          <span t="payment.reference"></span>
          <input name="reference" value.bind="payment.reference" autocomplete="off">
          <small class="error" repeat.for="message of paymentErrors.reference">${message}</small>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" click.trigger="paymentOpen = false" t="common.cancel"></button>
        <button type="submit" class="primary" disabled.bind="savingPayment" t="common.save"></button>
      </div>
    </form>
  </modal-dialog>

  <!-- Neu (Schritt 4): Kündigungsdialog -->
  <modal-dialog heading.bind="'contract.cancelTitle' | t" open.bind="cancelOpen">
    <form submit.trigger:prevent="saveCancellation()">
      <div class="form-grid">
        <label class="wide">
          <span t="contract.cancellationReason"></span>
          <textarea name="reason" rows="3" value.bind="cancelReason"></textarea>
          <small class="error" repeat.for="message of cancelErrors.reason">${message}</small>
        </label>
        <dl class="wide" if.bind="cancelPreview">
          <dt t="contract.expectedEndDate"></dt>
          <dd data-testid="expected-end-date">${formatDate(cancelPreview.endDate)}</dd>
        </dl>
        <p class="wide muted" t="contract.cancelHint"></p>
      </div>
      <div class="dialog-actions">
        <button type="button" click.trigger="cancelOpen = false" t="common.cancel"></button>
        <!-- Eigener Text, damit es auf Englisch nicht "Cancel" neben "Cancel contract" heißt -->
        <button type="submit" class="primary" t="contract.cancelConfirm"></button>
      </div>
    </form>
  </modal-dialog>

  <!-- Kündigung zurücknehmen: Bestätigung mit dem Vertragsende, das danach wieder gilt -->
  <modal-dialog heading.bind="'contract.undoCancel' | t" open.bind="undoOpen">
    <form submit.trigger:prevent="saveUndoCancellation()">
      <p t="contract.undoCancelHint"></p>
      <dl>
        <dt t="contract.endDateAfterUndo"></dt>
        <dd>${endDateAfterUndo}</dd>
      </dl>
      <p class="error" if.bind="undoError">${undoError}</p>
      <div class="dialog-actions">
        <button type="button" click.trigger="undoOpen = false" t="common.cancel"></button>
        <button type="submit" class="primary" disabled.bind="savingUndo" t="contract.undoCancel"></button>
      </div>
    </form>
  </modal-dialog>
</section>
