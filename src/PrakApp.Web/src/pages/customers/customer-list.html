<section class="page">
  <div class="page-header">
    <h1 t="customers.title"></h1>
    <button type="button" class="primary" click.trigger="showCreate()" t="customers.new"></button>
  </div>

  <div class="toolbar">
    <input type="search" class="search" value.bind="search" input.trigger="load() & debounce:300"
           t="[placeholder]customers.searchPlaceholder" data-testid="customer-search">
    <span class="muted">${customers.length} ${'customers.found' | t}</span>
  </div>

  <!-- Passende Verträge zur Vertragsnummer im Suchfeld; jeder Eintrag führt direkt zur Vertragsseite ("/" am Anfang) -->
  <div class="card contract-hits" if.bind="contractHits.length" data-testid="contract-hits">
    <h2 t="contracts.searchResults"></h2>
    <ul>
      <li repeat.for="hit of contractHits">
        <a load="/contracts/${hit.id}">${hit.contractNumber}</a> · ${hit.customerName} ·
        ${'contract.statusValues.' + hit.status | t}
      </li>
    </ul>
  </div>

  <jqx-grid columns.bind="columns" rows.bind="customers" row-click.bind="row => open(row)"></jqx-grid>

  <modal-dialog heading.bind="'customers.new' | t" open.bind="createOpen">
    <form submit.trigger:prevent="create()">
      <customer-form customer.bind="newCustomer" errors.bind="errors"></customer-form>
      <div class="dialog-actions">
        <button type="button" click.trigger="createOpen = false" t="common.cancel"></button>
        <button type="submit" class="primary" disabled.bind="saving" t="common.save"></button>
      </div>
    </form>
  </modal-dialog>
</section>
